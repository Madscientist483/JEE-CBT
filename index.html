<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE AI Admin Console</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-900">
<div class="min-h-screen">
<header class="bg-slate-900 text-white shadow"><div class="max-w-7xl mx-auto px-6 py-5">
<h1 class="text-2xl font-bold">JEE AI Question Console</h1>
<p class="text-slate-400 text-sm mt-1">Question generation and RAG verification dashboard</p>
</div></header>
<main class="max-w-7xl mx-auto px-6 py-8">
<section class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<div class="bg-white rounded-xl shadow p-6">
<h2 class="text-lg font-bold mb-5">Generate Test</h2>
<label class="block text-sm font-medium mb-2">Cohort</label>
<select id="cohort" class="w-full border rounded-lg p-2 mb-4"><option value="11th">Class 11th</option><option value="12th">Class 12th</option><option value="dropper">Dropper</option></select>
<label class="block text-sm font-medium mb-2">Topic</label>
<select id="topic" class="w-full border rounded-lg p-2 mb-4"></select>
<label class="block text-sm font-medium mb-2">Difficulty</label>
<select id="difficulty" class="w-full border rounded-lg p-2 mb-4"><option>Easy</option><option selected>Medium</option><option>Hard</option></select>
<label class="block text-sm font-medium mb-2">Question Count</label>
<input id="count" type="number" value="10" min="1" max="50" class="w-full border rounded-lg p-2 mb-5">
<button id="generate" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold">Generate & Verify</button>
<p id="status" class="text-sm text-slate-500 mt-4"></p>
</div>
<div class="lg:col-span-2">
<div class="bg-white rounded-xl shadow p-6 mb-6">
<div class="flex justify-between items-center"><div><h2 class="text-lg font-bold">Verification Statistics</h2><p class="text-slate-500 text-sm">Latest generated questions</p></div><button id="refresh" class="border px-4 py-2 rounded-lg">Refresh</button></div>
<div id="stats" class="grid grid-cols-3 gap-4 mt-6"></div>
</div>
<div class="bg-white rounded-xl shadow overflow-hidden">
<div class="p-6 border-b"><h2 class="text-lg font-bold">RAG Verification Log</h2></div>
<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="text-left p-4">Question</th><th class="text-left p-4">Difficulty</th><th class="text-left p-4">Confidence</th><th class="text-left p-4">Status</th></tr></thead><tbody id="questionTable"></tbody></table></div>
</div></div></section></main></div>
<script src="app.js"></script>
</body>
</html>
